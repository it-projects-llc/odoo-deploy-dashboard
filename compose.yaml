# Local container preview. Live Traefik/identity routing must be configured separately.
services:
  dashboard:
    build: .
    env_file: .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4173:4173"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
